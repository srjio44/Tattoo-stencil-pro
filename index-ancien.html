<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tattoo Stencil Pro V1</title>
<style>
body{margin:0;background:#0b0d12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}
main{max-width:1000px;margin:auto;padding:20px}h1{margin-bottom:4px}.muted{color:#9da3b3}
button,label{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#7c4dff;color:white;font-weight:700;text-align:center;box-sizing:border-box}
input[type=file]{display:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.card{background:#151821;border-radius:16px;padding:14px}.preview{height:360px;background:white;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden}
img{max-width:100%;max-height:100%;object-fit:contain}.row{margin:18px 0}.top{display:flex;justify-content:space-between}input[type=range]{width:100%;accent-color:#7c4dff}
.secondary{background:#252938;margin-top:10px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.preview{height:300px}}
</style>
</head>
<body><main>
<h1>Tattoo Stencil Pro</h1><div class="muted">Prototype V1 — Photo → Stencil</div>
<br><label for="photo">📷 IMPORTER UNE PHOTO</label><input id="photo" type="file" accept="image/*">
<div class="grid">
<div class="card"><b>AVANT</b><div class="preview"><span id="empty" class="muted">Choisis une photo</span><img id="orig" hidden></div></div>
<div class="card"><b>APRÈS — STENCIL V1</b><div class="preview"><img id="out" hidden></div></div>
</div>
<div class="card" style="margin-top:14px">
<b>RÉGLAGES</b>
<div class="row"><div class="top"><span>Détail</span><b id="dv">55%</b></div><input id="detail" type="range" min="0" max="100" value="55"></div>
<div class="row"><div class="top"><span>Sensibilité des contours</span><b id="sv">50%</b></div><input id="sens" type="range" min="0" max="100" value="50"></div>
<div class="row"><div class="top"><span>Finesse des traits</span><b id="fv">50%</b></div><input id="fine" type="range" min="0" max="100" value="50"></div>
<button id="reset" class="secondary">RÉINITIALISER</button>
<button id="save" style="margin-top:10px">⬇️ EXPORTER PNG</button>
</div></main>
<script>
const $=id=>document.getElementById(id), file=$('photo'),orig=$('orig'),out=$('out');
let img=null,canvas=null;
function render(){
 if(!img)return;
 const scale=Math.min(1,1400/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
 canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');c.drawImage(img,0,0,w,h);
 const d=c.getImageData(0,0,w,h),g=new Float32Array(w*h);
 for(let i=0,p=0;i<d.data.length;i+=4,p++)g[p]=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2];
 const o=c.createImageData(w,h),t=35+Number($('sens').value)*1.25,f=.7+Number($('fine').value)*.6,det=1-(Number($('detail').value)/100)*.35;
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){let i=y*w+x;
 const gx=-g[i-w-1]+g[i-w+1]-2*g[i-1]+2*g[i+1]-g[i+w-1]+g[i+w+1];
 const gy=-g[i-w-1]-2*g[i-w]-g[i-w+1]+g[i+w-1]+2*g[i+w]+g[i+w+1];
 const v=Math.hypot(gx,gy)*f*det>t?0:255,j=i*4;o.data[j]=o.data[j+1]=o.data[j+2]=v;o.data[j+3]=255}
 c.putImageData(o,0,0);out.src=canvas.toDataURL('image/png');out.hidden=false;
}
file.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{img=new Image();img.onload=()=>{orig.src=r.result;orig.hidden=false;$('empty').hidden=true;render()};img.src=r.result};r.readAsDataURL(f)};
[['detail','dv'],['sens','sv'],['fine','fv']].forEach(([a,b])=>$(a).oninput=()=>{$(b).textContent=$(a).value+'%';render()});
$('reset').onclick=()=>{[['detail','55'],['sens','50'],['fine','50']].forEach(([a,v])=>$(a).value=v);$('dv').textContent='55%';$('sv').textContent='50%';$('fv').textContent='50%';render()};
$('save').onclick=()=>{if(!canvas)return;let a=document.createElement('a');a.download='tattoo-stencil-v1.png';a.href=canvas.toDataURL('image/png');a.click()};
</script></body></html>
